name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop


jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -f docker/Dockerfile.ci -t openlib-ci .

      - name: Run build & tests in container
        run: docker run --rm -v "${{ github.workspace }}:/work" openlib-ci
